<app-shell title="Informações importantes">
  <p class="intro">Artigos selecionados para cuidar melhor da sua saúde e da sua família.</p>

  <ul class="articles">
    @for (article of articles; track article.url) {
      <li class="card article">
        <img
          class="article__image"
          [ngSrc]="imageSrc(article.image)"
          [priority]="$first"
          width="640"
          height="640"
          alt=""
        />
        <div class="article__body">
          <h2>{{ article.title }}</h2>
          <p>{{ article.summary }}</p>
          <a
            class="article__link"
            [href]="article.url"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="'Ler artigo: ' + article.title + ' (abre em nova aba)'"
          >
            Ler artigo <app-icon name="external-link" />
          </a>
        </div>
      </li>
    }
  </ul>
</app-shell>
