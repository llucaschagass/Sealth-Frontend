<app-shell title="Configurações">
  <div class="layout">
    <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h2>Seus dados</h2>
      <p class="hint">Altere apenas o que precisar. A senha só muda se você preencher o campo.</p>

      @if (loading()) {
        <p role="status">Carregando seus dados...</p>
      } @else {
        <div class="form-stack">
          @if (formError()) {
            <p class="alert alert--danger" role="alert">{{ formError() }}</p>
          }
          @if (success()) {
            <p class="alert alert--success" role="status">{{ success() }}</p>
          }

          <app-text-field formControlName="name" label="Nome" autocomplete="name" />
          <app-text-field
            formControlName="email"
            type="email"
            label="E-mail"
            autocomplete="email"
          />
          <app-text-field
            formControlName="password"
            type="password"
            label="Nova senha (opcional)"
            autocomplete="new-password"
          />

          <button type="submit" class="btn btn--primary" [disabled]="saving()">
            {{ saving() ? 'Salvando...' : 'Salvar alterações' }}
          </button>
        </div>
      }
    </form>

    <img
      class="illustration"
      src="/assets/images/illustrations/config.webp"
      alt=""
      width="800"
      height="586"
    />
  </div>
</app-shell>
