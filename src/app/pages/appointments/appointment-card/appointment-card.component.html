<article class="card appointment" [class.appointment--past]="past">
  <time class="appointment__date" [attr.datetime]="appointment.date">
    <span class="appointment__day">{{ dateParts(appointment.date).day }}</span>
    <span class="appointment__month">{{ dateParts(appointment.date).month }}</span>
    <span class="appointment__year">{{ dateParts(appointment.date).year }}</span>
  </time>

  <div class="appointment__body">
    <h3>{{ appointment.doctor }}</h3>
    <p class="appointment__specialty">{{ appointment.specialty }}</p>
    @if (appointment.location) {
      <p class="appointment__meta"><app-icon name="map-pin" /> {{ appointment.location }}</p>
    }
    @if (appointment.extraInfo) {
      <p class="appointment__meta">{{ appointment.extraInfo }}</p>
    }
  </div>

  <div class="appointment__actions">
    <button
      type="button"
      class="btn btn--ghost"
      [attr.aria-label]="'Editar ' + description"
      (click)="edit.emit(appointment)"
    >
      Editar
    </button>
    <button
      type="button"
      class="btn btn--ghost appointment__cancel"
      [attr.aria-label]="'Cancelar ' + description"
      (click)="cancel.emit(appointment)"
    >
      Cancelar
    </button>
  </div>
</article>
