<img src="/assets/images/brand/logo.webp" alt="" class="logo">

<div class="container">
    <div class="row">
        <div class="module-extra"></div>
        <div class="module-big" (click)="openAppointmentsComponent()">
            <img class="icon" src="/assets/images/icons/calendario.webp" alt="Logo">
            <span class="line1">Minhas</span>
            <span class="line2">Consultas</span>
            <img class="open-icon" src="/assets/images/icons/open.webp" alt="Abrir">
        </div>
    </div>
    <div class="row">
        <div class="module" (click)="openMedicinesComponent()">
            <img class="icon" src="/assets/images/icons/medicamentos.webp" alt="Medicamentos">
            <span class="line1">Meus</span>
            <span class="line2">Medicamentos</span>
            <img class="open-icon" src="/assets/images/icons/open.webp" alt="Abrir">
        </div>
        <div class="module" (click)="openInfoComponent()">
            <img class="icon" src="/assets/images/icons/avisos.webp" alt="Informações Importantes">
            <span class="line1">Informações</span>
            <span class="line2">Importantes</span>
            <img class="open-icon" src="/assets/images/icons/open.webp" alt="Abrir">
        </div>
    </div>
    <div class="row">
        <div class="module" (click)="openHealthComponent()">
            <img class="icon" src="/assets/images/icons/saude.webp" alt="Saúde">
            <span class="line1">Minha</span>
            <span class="line2">Saúde</span>
            <img class="open-icon" src="/assets/images/icons/open.webp" alt="Abrir">
        </div>
        <div class="module" (click)="openConfigComponent()">
            <img class="icon" src="/assets/images/icons/config.webp" alt="Configurações Gerais">
            <span class="line1">Configurações</span>
            <span class="line2">Gerais</span>
            <img class="open-icon" src="/assets/images/icons/open.webp" alt="Abrir">
        </div>
    </div>
</div>

<div class="overlay">
    <img src="/assets/images/icons/user.webp" alt="User Icon" (click)="confirmLogout()">
    <h1>Olá {{ username }}</h1>
</div>

<img src="/assets/images/illustrations/home.webp" alt="" class="home-ilustration">
