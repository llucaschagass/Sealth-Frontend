<app-auth-layout title="Crie sua conta" subtitle="Leva menos de um minuto e é gratuito.">
  <form class="form-stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (formError) {
      <p class="alert alert--danger" role="alert">{{ formError }}</p>
    }

    <app-text-field
      formControlName="name"
      label="Seu nome"
      placeholder="Maria Souza"
      autocomplete="name"
    />
    <app-text-field
      formControlName="email"
      type="email"
      label="E-mail"
      placeholder="exemplo@gmail.com"
      autocomplete="email"
    />
    <app-text-field
      formControlName="password"
      type="password"
      label="Senha"
      autocomplete="new-password"
    />
    <app-text-field
      formControlName="passwordConfirm"
      type="password"
      label="Confirme sua senha"
      autocomplete="new-password"
    />

    <button type="submit" class="btn btn--primary btn--block" [disabled]="loading">
      {{ loading ? 'Criando conta...' : 'Criar conta' }}
    </button>
  </form>

  <p authFooter>Já tem conta? <a routerLink="/login">Entrar</a></p>
</app-auth-layout>
