<app-auth-layout
  title="Crie uma nova senha"
  subtitle="Escolha uma senha que você não use em outros sites."
>
  @if (done()) {
    <div class="form-stack">
      <p class="alert alert--success" role="status">Senha redefinida com sucesso.</p>
      <a class="btn btn--primary btn--block" routerLink="/login">Entrar com a nova senha</a>
    </div>
  } @else if (linkError(); as reason) {
    <div class="form-stack">
      <p class="alert alert--danger" role="alert">{{ reason }}</p>
      <p>O link pode ter expirado ou já ter sido usado. Peça um novo para continuar.</p>
      <a class="btn btn--primary btn--block" routerLink="/forgot-password">Pedir novo link</a>
    </div>
  } @else {
    <form class="form-stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (formError()) {
        <p class="alert alert--danger" role="alert">{{ formError() }}</p>
      }

      <app-text-field
        formControlName="password"
        type="password"
        label="Nova senha"
        autocomplete="new-password"
      />
      <app-text-field
        formControlName="passwordConfirm"
        type="password"
        label="Confirme a nova senha"
        autocomplete="new-password"
      />

      <button type="submit" class="btn btn--primary btn--block" [disabled]="loading()">
        {{ loading() ? 'Salvando...' : 'Redefinir senha' }}
      </button>
    </form>
  }

  <p authFooter><a routerLink="/login">Voltar para o login</a></p>
</app-auth-layout>
