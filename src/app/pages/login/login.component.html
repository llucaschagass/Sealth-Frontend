<app-auth-layout
  title="Entre na sua conta"
  subtitle="Acesse suas consultas, medicamentos e informações de saúde."
>
  <form class="form-stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (formError) {
      <p class="alert alert--danger" role="alert">{{ formError }}</p>
    }

    <app-text-field
      formControlName="email"
      type="email"
      label="E-mail"
      placeholder="exemplo@gmail.com"
      autocomplete="email"
    />
    <app-text-field
      formControlName="password"
      type="password"
      label="Senha"
      autocomplete="current-password"
    />

    <a class="forgot" routerLink="/forgot-password">Esqueci minha senha</a>

    <button type="submit" class="btn btn--primary btn--block" [disabled]="loading">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p authFooter>Ainda não tem conta? <a routerLink="/signup">Cadastre-se</a></p>
</app-auth-layout>
