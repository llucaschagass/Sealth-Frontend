<app-auth-layout
  title="Esqueceu a senha?"
  subtitle="Informe seu e-mail e enviaremos um link para você criar uma nova senha."
>
  @if (sentTo(); as email) {
    <div class="form-stack">
      <p class="alert alert--success" role="status">
        Se <strong>{{ email }}</strong> estiver cadastrado, você receberá um link para redefinir a
        senha. Ele vale por 30 minutos.
      </p>
      <p>Não chegou? Confira a caixa de spam ou tente de novo com outro e-mail.</p>
      <button type="button" class="btn btn--secondary btn--block" (click)="retry()">
        Tentar outro e-mail
      </button>
    </div>
  } @else {
    <form class="form-stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (formError()) {
        <p class="alert alert--danger" role="alert">{{ formError() }}</p>
      }

      <app-text-field
        formControlName="email"
        type="email"
        label="E-mail"
        placeholder="exemplo@gmail.com"
        autocomplete="email"
      />

      <button type="submit" class="btn btn--primary btn--block" [disabled]="loading()">
        {{ loading() ? 'Enviando...' : 'Enviar link' }}
      </button>
    </form>
  }

  <p authFooter>Lembrou a senha? <a routerLink="/login">Voltar para o login</a></p>
</app-auth-layout>
