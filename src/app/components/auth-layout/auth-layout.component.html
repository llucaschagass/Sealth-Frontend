<main class="auth">
  <section class="auth__panel">
    <app-logo class="auth__logo" />
    <h1 class="auth__title">{{ title }}</h1>
    @if (subtitle) {
      <p class="auth__subtitle">{{ subtitle }}</p>
    }
    <ng-content />
    <div class="auth__footer">
      <ng-content select="[authFooter]" />
    </div>
  </section>

  <div class="auth__hero">
    <p class="auth__tagline">Transformando a saúde, conectando você ao cuidado.</p>
    <img src="/assets/images/illustrations/auth.webp" alt="" width="1200" height="516" />
  </div>
</main>
