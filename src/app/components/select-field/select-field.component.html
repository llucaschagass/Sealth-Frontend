<div class="field" [class.field--invalid]="errorMessage">
  <label class="field__label" [attr.for]="id">{{ label }}</label>
  <select
    class="field__input"
    [id]="id"
    [disabled]="disabled()"
    [attr.aria-invalid]="errorMessage ? true : null"
    [attr.aria-describedby]="errorMessage ? id + '-error' : null"
    (change)="onSelect($event)"
    (blur)="onBlur()"
  >
    @for (option of options; track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
  @if (errorMessage) {
    <p class="field__error" [id]="id + '-error'" role="alert">{{ errorMessage }}</p>
  }
</div>
